# Конвейер проверок (ADR-013, п. 8). Падение любого шага роняет проверку «checks».
# Запрет слияния с упавшей проверкой включается в настройках репозитория:
# Settings → Branches → правило для main → «Require status checks to pass» → checks.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    # PostgreSQL 16 для паритета адаптера базы (ADR-005, п. 7). Строка подключения передаётся
    # только шагу check:db: сквозные тесты и Lighthouse работают на демо-сборке без базы
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: Браузер для сквозных тестов
        run: bunx playwright install --with-deps chromium

      - name: Типы
        run: bun run typecheck

      - name: Линтер
        run: bun run lint

      - name: Тесты — домен, согласованность, негативные
        run: bun run test

      - name: Фикстуры против схемы
        run: bun run check:fixtures

      - name: PostgreSQL — миграции, паритет с демо, версия данных
        run: bun run check:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

      # Рабочий контур — то, что скачивает заказчик (ADR-013, поправка от 26.09.2026).
      # Собирается первым; в .output остаётся демонстрация, на ней идут сквозные тесты
      - name: Сборка рабочего контура
        run: bun run build:server
        env:
          NITRO_PRESET: node-server

      - name: Размер бандла — рабочий контур
        run: bun run check:bundle server

      - name: Сборка демонстрации
        run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Размер бандла — демонстрация
        run: bun run check:bundle demo

      - name: Сквозные тесты — роли, EMBER, axe, консоль
        run: bun run test:e2e

      - name: Lighthouse
        run: |
          PORT=4630 node .output/server/index.mjs &
          for i in $(seq 1 60); do curl -sf http://localhost:4630/projects >/dev/null && break; sleep 0.5; done
          bun run lighthouse
        env:
          LH_BASE: http://localhost:4630

      - name: Отчёт сквозных тестов при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
