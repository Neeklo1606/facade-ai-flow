# ГАЙКА на своём сервере (ADR-068): приложение, PostgreSQL, миграции и Caddy с HTTPS.
# Перед запуском: cp deploy/.env.example deploy/.env и заполнить значения.
#   docker compose --env-file deploy/.env up -d --build
#   docker compose --env-file deploy/.env run --rm migrate      # схема базы
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaika
      POSTGRES_USER: gaika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaika -d gaika"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
      args:
        MODE: ${GAIKA_MODE:-server}
    environment:
      DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build:
      context: .
      target: run
      args:
        MODE: ${GAIKA_MODE:-server}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika?sslmode=disable
      DATABASE_DRIVER: pg
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET}
      CLIENT_LINK_KEY: ${CLIENT_LINK_KEY:-}
      AUTH_CHANNEL: ${AUTH_CHANNEL:-log}
      DEMO_ACCESS_KEY: ${DEMO_ACCESS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      AI_MODE: ${AI_MODE:-demo}
      SEO_INDEX: ${SEO_INDEX:-}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
