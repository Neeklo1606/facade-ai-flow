# ГАЙКА на своём сервере (ADR-068): приложение, PostgreSQL, миграции и Caddy с HTTPS.
# Перед запуском: cp deploy/.env.example deploy/.env и заполнить значения.
#   docker compose --env-file deploy/.env up -d --build
#   docker compose --env-file deploy/.env run --rm migrate      # схема базы
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaika
      POSTGRES_USER: gaika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaika -d gaika"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
      args:
        MODE: ${GAIKA_MODE:-server}
    environment:
      DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET}
      # Команды пилота (ADR-069): db:gas-init и db:gas-user считают день в том же поясе
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build:
      context: .
      target: run
      args:
        MODE: ${GAIKA_MODE:-server}
        VITE_PUBLIC_URL: https://${DOMAIN:?задайте DOMAIN}
        VITE_CONTACT_TG: ${CONTACT_TG:-}
        VITE_METRIKA_ID: ${METRIKA_ID:-}
        VITE_YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
        VITE_GOOGLE_VERIFICATION: ${GOOGLE_VERIFICATION:-}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika?sslmode=disable
      DATABASE_DRIVER: pg
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET}
      CLIENT_LINK_KEY: ${CLIENT_LINK_KEY:-}
      AUTH_CHANNEL: ${AUTH_CHANNEL:-log}
      DEMO_ACCESS_KEY: ${DEMO_ACCESS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      AI_MODE: ${AI_MODE:-demo}
      SEO_INDEX: ${SEO_INDEX:-}
      PUBLIC_URL: https://${DOMAIN}
      # Исходные файлы смет (ADR-086): том estimate-files, в копию входит вместе с базой
      ESTIMATE_FILES_DIR: /data/estimate-files
    volumes:
      - estimate-files:/data/estimate-files
    depends_on:
      db:
        condition: service_healthy

  # Резервная копия базы и файлов смет (ADR-086): запускается по cron хоста, см. docs/runbook/docker.md
  #   docker compose --env-file deploy/.env --profile tools run --rm backup
  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika?sslmode=disable
      ESTIMATE_FILES_DIR: /data/estimate-files
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/gas-backup.sh:/opt/gas-backup.sh:ro
      - estimate-files:/data/estimate-files:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["sh", "/opt/gas-backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Проверка восстановления копии в ОТДЕЛЬНУЮ базу gaika_restore и временный каталог
  #   docker compose --env-file deploy/.env --profile tools run --rm restore-check /backups/gaika-…
  restore-check:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika?sslmode=disable
      RESTORE_DATABASE_URL: postgres://gaika:${POSTGRES_PASSWORD}@db:5432/gaika_restore?sslmode=disable
      RESTORE_FILES_DIR: /tmp/restore-files
    volumes:
      - ./scripts/gas-restore-check.sh:/opt/gas-restore-check.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
    entrypoint: ["sh", "/opt/gas-restore-check.sh"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  estimate-files:
